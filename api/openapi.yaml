openapi: 3.0.3
info:
  title: Ticket QR Code Generator Worker API
  version: 1.0.0
  description: >
    API contracts (planning only, no implementation yet).
    All text inputs MUST be sanitized against XSS before storage.
    All list endpoints return an empty array (never an error) when no data exists.
servers:
  - url: /api/v1
security:
  - bearerAuth: []

paths:
  /events/{eventId}/tickets:
    get:
      summary: List tickets for an event
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: string } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Page of tickets. `items` is [] when nothing matches (UI shows "No data found").
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Ticket" } }
                  nextCursor: { type: string, nullable: true }
        "404": { $ref: "#/components/responses/Error" }

  /tickets:
    post:
      summary: Create a ticket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /tickets/{ticketId}/qr-jobs:
    post:
      summary: Request QR generation (asynchronous, retry-safe)
      description: Repeating the same Idempotency-Key returns the original job instead of creating a new one.
      parameters:
        - { name: ticketId, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 64 } }
      responses:
        "202":
          description: Job accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QrJob" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /qr-jobs/{jobId}:
    get:
      summary: Poll job status (client shows a loading indicator until status is succeeded or failed)
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Job state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QrJob" }
        "404": { $ref: "#/components/responses/Error" }

  /tickets/{ticketId}/qr:
    get:
      summary: Get the active QR code for a ticket
      parameters:
        - { name: ticketId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Active QR code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QrCode" }
        "404": { $ref: "#/components/responses/Error" }

  /qr-scans:
    post:
      summary: Validate a scanned QR code at the gate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload, signature]
              properties:
                payload: { type: string, maxLength: 2048 }
                signature: { type: string, maxLength: 512 }
      responses:
        "200":
          description: Scan result (always logged)
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    type: string
                    enum: [valid, already_used, revoked, invalid_signature, cancelled]
        "422": { $ref: "#/components/responses/ValidationError" }

  /analytics:
    post:
      summary: Record a telemetry ping (client also logs "[Analytics] ..." to console)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventName]
              properties:
                eventName: { type: string, maxLength: 100 }
                entityType: { type: string, maxLength: 50 }
                entityId: { type: string, maxLength: 64 }
      responses:
        "204": { description: Recorded }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }

  schemas:
    TicketInput:
      type: object
      required: [eventId, holderName, holderEmail]
      properties:
        eventId: { type: string }
        holderName: { type: string, minLength: 1, maxLength: 120 }
        holderEmail: { type: string, format: email, maxLength: 254 }
    Ticket:
      type: object
      required: [id, eventId, holderName, holderEmail, ticketCode, status, createdAt]
      properties:
        id: { type: string }
        eventId: { type: string }
        holderName: { type: string }
        holderEmail: { type: string }
        ticketCode: { type: string }
        status: { type: string, enum: [issued, checked_in, cancelled] }
        createdAt: { type: string, format: date-time }
    QrJob:
      type: object
      required: [id, ticketId, status, attempts]
      properties:
        id: { type: string }
        ticketId: { type: string }
        status: { type: string, enum: [queued, processing, succeeded, failed] }
        attempts: { type: integer }
        lastError: { type: string, nullable: true }
    QrCode:
      type: object
      required: [id, ticketId, payload, imageFormat, imageData, version]
      properties:
        id: { type: string }
        ticketId: { type: string }
        payload: { type: string }
        imageFormat: { type: string, enum: [png, svg] }
        imageData: { type: string, description: Base64 PNG or SVG markup }
        version: { type: integer }
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            fields:
              type: array
              description: Offending fields; the UI highlights these in red.
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    ValidationError:
      description: Missing or malformed input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }